<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BOCA2 WINGS POS — Sistema Integral de Gestión</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            boca: {
              black: '#0a0a0c',
              dark: '#111114',
              card: '#18181d',
              border: '#272730',
              muted: '#9494a3',
              cream: '#FAF3E0',
              creamHover: '#F2E6C9',
              creamDark: '#D8C39E',
              gold: '#C5A059',
              goldLight: '#E5C57E',
              red: '#EF4444',
              green: '#10B981',
              orange: '#F97316'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            display: ['Montserrat', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbars and styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(20, 20, 24, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(197, 160, 89, 0.3);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(197, 160, 89, 0.6);
    }
    .badge-glow {
      box-shadow: 0 0 15px rgba(197, 160, 89, 0.25);
    }
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .animate-pulse-subtle {
      animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @media print {
      body * {
        visibility: hidden;
      }
      #print-ticket-area, #print-ticket-area * {
        visibility: visible;
      }
      #print-ticket-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 80mm;
      }
    }
  </style>
</head>
<body class="bg-boca-black text-neutral-100 font-sans min-h-screen flex flex-col selection:bg-boca-cream selection:text-boca-black antialiased">
  <div id="app" class="flex-1 flex flex-col">
    <!-- Rendered reactively by app.js -->
  </div>

  <div id="print-ticket-area" class="hidden"></div>

  <!-- Lucide Icons & App Logic -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/app.js"></script>
</body>
</html>
